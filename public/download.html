<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Download - SweetEscape</title>
<meta name="description" content="Search and download any song as MP3">
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/all.min.css">
<style>
:root {
  --bg-primary: #f4f4f4;
  --bg-secondary: #ffffff;
  --text-primary: #333;
  --text-secondary: #666;
  --accent-color: #5D9C59;
  --hover-color: #4A7C59;
  --border-color: #ddd;
  --button-text-color: #ffffff;
  --error-color: #dc3545;
}
[data-theme='dark'] {
  --bg-primary: #121212;
  --bg-secondary: #1e1e1e;
  --text-primary: #e0e0e0;
  --text-secondary: #b0b0b0;
  --accent-color: #3A6B35;
  --hover-color: #4D7C46;
  --border-color: #444;
}
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  background-color: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  padding: 1.5rem 1rem 3rem;
}
.container {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}
.page-title {
  font-size: 1.4rem;
  font-weight: 600;
  text-align: center;
}
.page-subtitle {
  font-size: 0.9rem;
  color: var(--text-secondary);
  text-align: center;
}
.search-bar {
  display: flex;
  gap: 0.5rem;
}
.search-input-wrap {
  flex: 1;
  display: flex;
  align-items: stretch;
  background-color: var(--bg-secondary);
  border: 1px solid var(--border-color);
  min-width: 0;
}
.search-input-wrap:focus-within {
  border-color: var(--accent-color);
}
.search-input-wrap input {
  flex: 1;
  min-width: 0;
  padding: 0.85rem 1rem;
  background-color: transparent;
  color: var(--text-primary);
  border: none;
  font-size: 1rem;
  outline: none;
}
.topic-toggle-btn {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  padding: 0 0.75rem;
  border: none;
  border-left: 1px solid var(--border-color);
  background: transparent;
  color: var(--accent-color);
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.2px;
  white-space: nowrap;
  cursor: pointer;
  transition: color 0.15s, opacity 0.15s;
}
.topic-toggle-btn.is-off {
  color: var(--text-secondary);
  text-decoration: line-through;
  opacity: 0.6;
}
.search-bar button.search-btn {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.85rem 1.25rem;
  background-color: var(--accent-color);
  color: var(--button-text-color);
  border: none;
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
}
.search-bar button.search-btn:hover {
  background-color: var(--hover-color);
}
.search-bar button.search-btn:disabled {
  background-color: var(--text-secondary);
  cursor: not-allowed;
  opacity: 0.6;
}
.message {
  padding: 0.85rem 1rem;
  background-color: var(--accent-color);
  color: var(--button-text-color);
  text-align: center;
  font-weight: 500;
  display: none;
}
.message.error {
  background-color: var(--error-color);
}
.message.show {
  display: block;
}
.results {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}
.result-item {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  padding: 0.6rem;
  background-color: var(--bg-secondary);
  border: 1px solid var(--border-color);
}
.result-thumb {
  width: 72px;
  height: 72px;
  flex-shrink: 0;
  background-color: var(--bg-primary);
  background-size: cover;
  background-position: center;
}
.result-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}
.result-name {
  font-size: 0.95rem;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.result-author {
  font-size: 0.85rem;
  color: var(--text-secondary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.result-status {
  font-size: 0.8rem;
  color: var(--accent-color);
}
.result-status.error {
  color: var(--error-color);
}
.result-action {
  flex-shrink: 0;
  width: 44px;
  height: 44px;
  border: none;
  background-color: var(--accent-color);
  color: var(--button-text-color);
  cursor: pointer;
  font-size: 1.1rem;
  display: flex;
  align-items: center;
  justify-content: center;
}
.result-action:hover {
  background-color: var(--hover-color);
}
.result-action:disabled {
  background-color: var(--text-secondary);
  cursor: not-allowed;
  opacity: 0.6;
}
.result-action.done {
  background-color: var(--accent-color);
}
.empty-state {
  text-align: center;
  color: var(--text-secondary);
  font-size: 0.9rem;
  padding: 1.5rem 0;
}
.show-more-btn {
  display: none;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.75rem;
  background-color: var(--bg-secondary);
  color: var(--text-primary);
  border: 1px solid var(--border-color);
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
}
.show-more-btn.visible {
  display: flex;
}
.show-more-btn:hover {
  background-color: var(--bg-primary);
}
.show-more-btn:disabled {
  cursor: not-allowed;
  opacity: 0.6;
}
.back-link {
  display: block;
  text-align: center;
  color: var(--text-secondary);
  font-size: 0.85rem;
  text-decoration: none;
  margin-top: 0.5rem;
}
.back-link:hover {
  color: var(--text-primary);
}
</style>
</head>
<body>
<div class="container">
  <div class="page-title">Download a Song</div>
  <div class="page-subtitle">Search for a song, then tap a result to download it as MP3</div>

  <div class="search-bar">
    <div class="search-input-wrap">
      <input type="text" id="searchInput" placeholder="Song name or artist" autocomplete="off" autocapitalize="off" enterkeyhint="search">
      <button class="topic-toggle-btn" id="topicToggleBtn" title='Appends "topic" to the search — topic videos are usually the cleanest audio-only upload' aria-label='Toggle "topic" keyword'>"topic"</button>
    </div>
    <button class="search-btn" id="searchBtn"><i class="fas fa-search"></i> Search</button>
  </div>

  <div class="message" id="message"></div>

  <div class="results" id="results"></div>

  <button class="show-more-btn" id="showMoreBtn"><i class="fas fa-chevron-down"></i> Show 3 more</button>

  <a class="back-link" href="/">Back to SweetEscape</a>
</div>

<script>
class DownloadPage {
  constructor() {
    this.elements = {
      searchInput: document.getElementById('searchInput'),
      searchBtn: document.getElementById('searchBtn'),
      topicToggleBtn: document.getElementById('topicToggleBtn'),
      showMoreBtn: document.getElementById('showMoreBtn'),
      message: document.getElementById('message'),
      results: document.getElementById('results')
    };
    this.results = [];
    this.topicKeywordEnabled = true;
    this.effectiveQuery = '';
    this.keyIndex = 0;
    this.nextPageToken = null;
    this.setupEventListeners();
    this.elements.results.innerHTML = '<div class="empty-state">Search above to find a song</div>';
  }

  setupEventListeners() {
    this.elements.searchBtn.addEventListener('click', () => this.search());
    this.elements.searchInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') this.search();
    });
    this.elements.topicToggleBtn.addEventListener('click', () => this.toggleTopicKeyword());
    this.elements.showMoreBtn.addEventListener('click', () => this.showMore());
  }

  toggleTopicKeyword() {
    this.topicKeywordEnabled = !this.topicKeywordEnabled;
    this.elements.topicToggleBtn.classList.toggle('is-off', !this.topicKeywordEnabled);
  }

  showMessage(text, type = 'success') {
    this.elements.message.textContent = text;
    this.elements.message.className = `message ${type} show`;
    setTimeout(() => this.elements.message.classList.remove('show'), 5000);
  }

  async search() {
    const query = this.elements.searchInput.value.trim();
    if (!query) {
      this.elements.searchInput.focus();
      return;
    }
    this.results = [];
    this.nextPageToken = null;
    this.effectiveQuery = this.topicKeywordEnabled ? `${query} "topic"` : query;
    this.keyIndex = Math.floor(Math.random() * 5);
    this.elements.showMoreBtn.classList.remove('visible');
    this.elements.searchBtn.disabled = true;
    this.elements.searchBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Searching…';
    this.elements.results.innerHTML = '<div class="empty-state">Searching…</div>';

    try {
      const { items, nextPageToken } = await this.fetchResults(null);
      this.nextPageToken = nextPageToken;
      if (!items.length) {
        this.elements.results.innerHTML = '<div class="empty-state">No results found</div>';
      } else {
        this.elements.results.innerHTML = '';
        this.appendResults(items);
      }
      this.elements.showMoreBtn.classList.toggle('visible', !!this.nextPageToken);
    } catch (err) {
      this.elements.results.innerHTML = '';
      this.showMessage('Search failed. Please try again.', 'error');
    } finally {
      this.elements.searchBtn.disabled = false;
      this.elements.searchBtn.innerHTML = '<i class="fas fa-search"></i> Search';
    }
  }

  async showMore() {
    if (!this.nextPageToken) return;
    this.elements.showMoreBtn.disabled = true;
    this.elements.showMoreBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Loading…';
    try {
      const { items, nextPageToken } = await this.fetchResults(this.nextPageToken);
      this.nextPageToken = nextPageToken;
      this.appendResults(items);
      this.elements.showMoreBtn.classList.toggle('visible', !!this.nextPageToken);
    } catch (err) {
      this.showMessage('Failed to load more results.', 'error');
    } finally {
      this.elements.showMoreBtn.disabled = false;
      this.elements.showMoreBtn.innerHTML = '<i class="fas fa-chevron-down"></i> Show 3 more';
    }
  }

  async fetchResults(pageToken) {
    let url = `/api/youtube?query=${encodeURIComponent(this.effectiveQuery)}&maxResults=3&type=combined&keyIndex=${this.keyIndex}`;
    if (pageToken) url += `&pageToken=${encodeURIComponent(pageToken)}`;
    const res = await fetch(url);
    const result = await res.json();
    if (result.status !== 200) {
      throw new Error('search_failed');
    }
    const items = ((result.data && result.data.items) || []).map(item => ({
      videoId: item.id.videoId,
      name: item.snippet.title,
      author: item.snippet.channelTitle,
      thumb: (item.snippet.thumbnails && (item.snippet.thumbnails.medium || item.snippet.thumbnails.default) || {}).url || '',
      status: 'idle',
      link: null
    }));
    return { items, nextPageToken: (result.data && result.data.nextPageToken) || null };
  }

  appendResults(items) {
    items.forEach(item => {
      this.results.push(item);
      const el = document.createElement('div');
      el.className = 'result-item';
      el.innerHTML = `
        <div class="result-thumb" style="${item.thumb ? `background-image:url(${item.thumb})` : ''}"></div>
        <div class="result-info">
          <div class="result-name"></div>
          <div class="result-author"></div>
          <div class="result-status" style="display:none"></div>
        </div>
        <button class="result-action" title="Download"><i class="fas fa-download"></i></button>
      `;
      el.querySelector('.result-name').textContent = item.name;
      el.querySelector('.result-author').textContent = item.author;
      el.querySelector('.result-action').addEventListener('click', () => this.downloadItem(item, el));
      this.elements.results.appendChild(el);
    });
  }

  setItemStatus(el, item, status, text) {
    item.status = status;
    const statusEl = el.querySelector('.result-status');
    const btn = el.querySelector('.result-action');
    if (text) {
      statusEl.style.display = '';
      statusEl.textContent = text;
      statusEl.className = `result-status${status === 'error' ? ' error' : ''}`;
    } else {
      statusEl.style.display = 'none';
    }
    if (status === 'converting') {
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
    } else if (status === 'done') {
      btn.disabled = false;
      btn.classList.add('done');
      btn.innerHTML = '<i class="fas fa-download"></i>';
    } else if (status === 'error') {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-redo"></i>';
    } else {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-download"></i>';
    }
  }

  downloadItem(item, el) {
    if (item.status === 'done' && item.link) {
      window.open(item.link, '_blank');
      return;
    }
    if (item.status === 'converting') return;
    this.convertItem(item, el, 0);
  }

  async convertItem(item, el, retries) {
    this.setItemStatus(el, item, 'converting', 'Converting…');
    try {
      const res = await fetch(`/api/download?videoId=${item.videoId}`);
      const data = await res.json();
      if (data.status === 'ok' && data.link) {
        item.link = data.link;
        this.setItemStatus(el, item, 'done', 'Ready — tap to download');
        window.open(item.link, '_blank');
      } else if (data.progress !== undefined && data.progress < 100) {
        if (retries >= 5) {
          this.setItemStatus(el, item, 'error', 'Failed — tap to retry');
        } else {
          setTimeout(() => this.convertItem(item, el, retries + 1), 8000);
        }
      } else if (data.error === 'quota_exceeded') {
        this.setItemStatus(el, item, 'error', 'API limit reached — tap to retry');
      } else {
        this.setItemStatus(el, item, 'error', 'Failed — tap to retry');
      }
    } catch (err) {
      this.setItemStatus(el, item, 'error', 'Failed — tap to retry');
    }
  }
}

new DownloadPage();
</script>
</body>
</html>
